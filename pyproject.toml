[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glycocontext"
version = "0.1.0"
description = "Cell-conditioned sequence, secondary-structure and frozen RNA-FM site prediction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "torch>=2.6,<2.7", "scikit-learn==1.7.2"]

[project.optional-dependencies]
prepare = ["ViennaRNA==2.7.2"]
grouping = ["edlib==1.3.9.post1"]
baselines = ["lightgbm==4.6.0", "joblib>=1.3,<2"]
figures = ["matplotlib>=3.8,<4"]
interpretability = ["matplotlib>=3.8,<4", "multimolecule"]

[tool.setuptools.packages.find]
where = ["src"]
